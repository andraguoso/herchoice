<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HerChoice</title>
    <link rel="stylesheet" href="output.css">
</head>

<body>
    <nav class="bg-crimson flex flex-row p-5">
        <img class="w-64" alt="herchoice logo">
        <div class="flex flex-row gap-5 items-end">
            <a class="text-white rounded-md hover:bg-red-800" href="about.html">Acerca de</a>
            <a class="text-white">Recursos</a>
            <a class="text-white"> Próximas competencias</a>
            <a class="text-white">Comunidad</a>
        </div>
    </nav>
    <div class="flex flex-row">
        <img>
        <div class="flex flex-col">
            <span>¡Queremos ayudarte!</span>
            <span>Ingresa tus datos y te enviaremos todas las oportunidades que el Perú tiene para ti.</span>
            <form>
                <div>
                    <label>Nombre:</label>
                    <input type="text">
                </div>
                <div>
                    <span>Cursos de interés:</span>
                    <div class="grid grid-cols-2">
                        <button>Biología</button>
                        <button>Física</button>
                        <button>Química</button>
                        <button>Informática</button>
                    </div>
                </div>
                <div>
                    <label>Email:</label>
                    <input type="email">
                </div>
            </form>
        </div>
    </div>

</body>

<footer>
    HerChoice 2025
</footer>

</html>
