<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HerChoice</title>
    <link rel="stylesheet" href="output.css">
</head>

<body>
    <nav class="bg-crimson flex flex-row p-5">
        <img class="w-64" alt="herchoice logo">
        <div class="flex flex-row gap-5 items-end">
            <a class="text-white rounded-md hover:bg-red-800" href="about.html">Acerca de</a>
            <a class="text-white">Recursos</a>
            <a class="text-white"> Próximas competencias</a>
            <a class="text-white">Comunidad</a>
        </div>
    </nav>
    <div class="flex flex-row bg-note">
        <img class="w-1/2">
        <div class="flex flex-col w-1/2 p-10 gap-2">
            <span class="text-5xl">¡Queremos ayudarte!</span>
            <span>Ingresa tus datos y te enviaremos todas las oportunidades que el Perú tiene para ti.</span>
            <form>
                <div class="flex flex-col">
                    <label>Nombre:</label>
                    <input type="text">
                </div>
                <div>
                    <span>Cursos de interés:</span>
                    <div class="grid grid-cols-2 gap-3">
                        <button class="rounded-full bg-crimson text-white w-32 p-2">Biología</button>
                        <button class="rounded-full bg-crimson text-white w-32 p-2">Física</button>
                        <button class="rounded-full bg-crimson text-white w-32 p-2">Química</button>
                        <button class="rounded-full bg-crimson text-white w-32 p-2">Informática</button>
                    </div>
                </div>
                <div class="flex flex-col">
                    <label>Email:</label>
                    <input type="email">
                </div>
            </form>
        </div>
    </div>

</body>

<footer class="flex justify-center">
    HerChoice 2025
</footer>

</html>
